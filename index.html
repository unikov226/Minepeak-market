<section class="auth-section">

```
<div class="auth-box">

    <h1 id="auth-title">
        Welcome back
    </h1>

    <p id="auth-description">
        Log in to continue to MinePeak Market.
    </p>


    <!-- LOGIN / SIGN UP TABS -->

    <div class="auth-tabs">

        <button
            type="button"
            id="login-tab"
            class="active"
        >
            Login
        </button>

        <button
            type="button"
            id="signup-tab"
        >
            Sign Up
        </button>

    </div>


    <!-- AUTH FORM -->

    <form id="auth-form">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            class="btn primary"
            id="auth-button"
        >
            Login
        </button>


        <p id="auth-message"></p>

    </form>

</div>
```

</section>

</main>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* =================================
       SUPABASE CONFIG
    ================================= */

    const SUPABASE_URL = "YOUR_SUPABASE_URL";

    const SUPABASE_PUBLISHABLE_KEY =
        "YOUR_SUPABASE_PUBLISHABLE_KEY";


    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    /* =================================
       ELEMENTS
    ================================= */

    const form =
        document.getElementById("auth-form");

    const button =
        document.getElementById("auth-button");

    const message =
        document.getElementById("auth-message");

    const loginTab =
        document.getElementById("login-tab");

    const signupTab =
        document.getElementById("signup-tab");

    const title =
        document.getElementById("auth-title");

    const description =
        document.getElementById("auth-description");


    let signupMode = false;


    /* =================================
       LOGIN TAB
    ================================= */

    loginTab.addEventListener("click", function () {

        signupMode = false;

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        title.textContent =
            "Welcome back";

        description.textContent =
            "Log in to continue to MinePeak Market.";

        button.textContent =
            "Login";

        message.textContent = "";

    });


    /* =================================
       SIGN UP TAB
    ================================= */

    signupTab.addEventListener("click", function () {

        signupMode = true;

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        title.textContent =
            "Create your account";

        description.textContent =
            "Join MinePeak Market and start trading.";

        button.textContent =
            "Create Account";

        message.textContent = "";

    });


    /* =================================
       FORM SUBMISSION
    ================================= */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            return;
        }


        button.disabled = true;

        message.textContent =
            "Please wait...";


        /* =================================
           SIGN UP
        ================================= */

        if (signupMode) {

            const { error } =
                await supabase.auth.signUp({

                    email: email,
                    password: password

                });


            button.disabled = false;


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            message.textContent =
                "Account created! Check your email to verify your account.";

            return;
        }


        /* =================================
           LOGIN
        ================================= */

        const { error } =
            await supabase.auth.signInWithPassword({

                email: email,
                password: password

            });


        button.disabled = false;


        if (error) {

            message.textContent =
                error.message;

            return;
        }


        message.textContent =
            "Login successful!";


        setTimeout(function () {

            window.location.href =
                "index.html";

        }, 1000);

    });

</script>

</body>
</html>
