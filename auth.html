<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MinePeak Market</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #edf4ff,
                    #f7f9fc
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-page {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-logo {
            text-align: center;
            font-size: 30px;
            font-weight: 900;
            color: #246bfd;
            margin-bottom: 22px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow:
                0 10px 35px rgba(30, 50, 80, .12);
            border: 1px solid #e1e7ef;
        }

        .auth-card h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .auth-subtitle {
            text-align: center;
            color: #758196;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .auth-tabs {
            display: flex;
            background: #edf2f8;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 11px;
            border-radius: 6px;
            font-weight: 700;
            color: #66748a;
            cursor: pointer;
        }

        .auth-tab.active {
            background: white;
            color: #246bfd;
            box-shadow: 0 2px 7px rgba(0,0,0,.08);
        }

        .auth-form input {
            width: 100%;
            height: 48px;
            border: 1px solid #ccd5e1;
            border-radius: 8px;
            padding: 0 14px;
            margin-bottom: 12px;
            font-size: 14px;
            outline: none;
        }

        .auth-form input:focus {
            border-color: #246bfd;
            box-shadow: 0 0 0 3px rgba(36,107,253,.08);
        }

        .auth-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #246bfd;
            color: white;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }

        .auth-button:hover {
            background: #165be0;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #246bfd;
            font-size: 14px;
            font-weight: 700;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        .discord-contact {
            text-align: center;
            margin-top: 18px;
            color: #78859a;
            font-size: 13px;
        }

        .discord-contact a {
            color: #5865f2;
            font-weight: 800;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6d7a8e;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="auth-page">

    <div class="auth-logo">
        ⛏️ MinePeak Market
    </div>

    <div class="auth-card">

        <h1 id="authTitle">
            Log in
        </h1>

        <p class="auth-subtitle" id="authSubtitle">
            Welcome back to MinePeak Market.
        </p>


        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="loginTab"
                onclick="switchMode('login')"
            >
                Log In
            </button>

            <button
                class="auth-tab"
                id="signupTab"
                onclick="switchMode('signup')"
            >
                Sign Up
            </button>

        </div>


        <form
            class="auth-form"
            id="authForm"
        >

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                class="auth-button"
                type="submit"
                id="authButton"
            >
                Log In
            </button>

        </form>


        <a
            href="#"
            class="forgot"
            id="forgotPassword"
            onclick="forgotPassword(event)"
        >
            Forgot your password?
        </a>


        <div
            class="auth-message"
            id="authMessage"
        ></div>


        <div class="discord-contact">

            Need help?

            <a
                href="https://discord.gg/uPrkZWFkp"
                target="_blank"
            >
                Discord · Drexar_226
            </a>

        </div>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to MinePeak Market
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://uxxcmrewhohvhetfjlle.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_44ZK_yp2muDR6QqpErQKJg_etMtYTUW";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let signupMode = false;


function switchMode(mode) {

    signupMode = mode === "signup";

    const loginTab =
        document.getElementById("loginTab");

    const signupTab =
        document.getElementById("signupTab");

    const title =
        document.getElementById("authTitle");

    const subtitle =
        document.getElementById("authSubtitle");

    const button =
        document.getElementById("authButton");

    const forgot =
        document.getElementById("forgotPassword");


    if (signupMode) {

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        title.textContent = "Create an account";

        subtitle.textContent =
            "Join MinePeak Market today.";

        button.textContent =
            "Create Account";

        forgot.style.display =
            "none";

    } else {

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        title.textContent =
            "Log in";

        subtitle.textContent =
            "Welcome back to MinePeak Market.";

        button.textContent =
            "Log In";

        forgot.style.display =
            "block";
    }
}


document
    .getElementById("authForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;

        const message =
            document.getElementById("authMessage");


        message.textContent =
            "Please wait...";


        if (signupMode) {

            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            message.textContent =
                "Account created. Check your email to confirm your account.";

        } else {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            window.location.href =
                "index.html";
        }

    });


async function forgotPassword(event) {

    event.preventDefault();

    const email =
        document.getElementById("email")
            .value
            .trim();

    const message =
        document.getElementById("authMessage");


    if (!email) {

        message.textContent =
            "Enter your email address first.";

        return;
    }


    const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin +
                    "/auth.html"
            }
        );


    if (error) {

        message.textContent =
            error.message;

        return;
    }


    message.textContent =
        "Password reset instructions have been sent to your email.";
}


/* Open the correct tab when ?mode=signup is used */

const params =
    new URLSearchParams(window.location.search);

if (params.get("mode") === "signup") {
    switchMode("signup");
}

</script>

</body>
</html>
