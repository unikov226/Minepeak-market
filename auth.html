<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MinePeak Market</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =================================
           AUTHENTICATION
        ================================= */

        .auth-box {
            overflow: hidden;
        }

        /* =================================
           TABS
        ================================= */

        .auth-tabs {
            position: relative;
            display: flex;
            border-bottom: 1px solid #dddfe2;
            margin-bottom: 24px;
        }

        .auth-tabs button {
            position: relative;
            z-index: 2;

            flex: 1;

            background: transparent;
            border: none;

            padding: 14px;

            font-size: 16px;
            font-weight: 600;

            color: #65676b;

            cursor: pointer;

            transition:
                color 0.25s ease,
                background 0.25s ease;
        }

        .auth-tabs button:hover {
            background: #f5f6f7;
        }

        .auth-tabs button.active {
            color: #1877f2;
        }

        /* Sliding blue line */

        .tab-indicator {
            position: absolute;

            bottom: -1px;
            left: 0;

            width: 50%;
            height: 3px;

            background: #1877f2;

            border-radius: 3px 3px 0 0;

            transition:
                transform 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        .tab-indicator.signup {
            transform: translateX(100%);
        }

        /* =================================
           AUTH CONTENT ANIMATION
        ================================= */

        .auth-content {
            position: relative;
            overflow: hidden;
        }

        .auth-copy {
            transition:
                opacity 0.25s ease,
                transform 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        .auth-copy.slide-left {
            opacity: 0;
            transform: translateX(-25px);
        }

        .auth-copy.slide-right {
            opacity: 0;
            transform: translateX(25px);
        }

        /* =================================
           FORM ANIMATION
        ================================= */

        #auth-form {
            transition:
                opacity 0.25s ease,
                transform 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        #auth-form.slide-left {
            opacity: 0;
            transform: translateX(-30px);
        }

        #auth-form.slide-right {
            opacity: 0;
            transform: translateX(30px);
        }

        /* =================================
           BUTTON
        ================================= */

        #auth-button {
            transition:
                background 0.2s ease,
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        #auth-button:hover {
            transform: translateY(-1px);
        }

        #auth-button:active {
            transform: translateY(0);
        }

        /* =================================
           MESSAGE
        ================================= */

        #auth-message {
            min-height: 21px;
        }
    </style>
</head>


<body>

<header class="navbar">

    <div class="logo">
        ⛏️ MinePeak Market
    </div>

    <nav>
        <a href="index.html">Home</a>
    </nav>

</header>


<main>

<section class="auth-section">

    <div class="auth-box">

        <!-- TABS -->

        <div class="auth-tabs">

            <button
                type="button"
                id="login-tab"
                class="active"
            >
                Login
            </button>

            <button
                type="button"
                id="signup-tab"
            >
                Sign Up
            </button>

            <div
                id="tab-indicator"
                class="tab-indicator"
            ></div>

        </div>


        <div class="auth-content">

            <!-- TITLE + DESCRIPTION -->

            <div
                id="auth-copy"
                class="auth-copy"
            >

                <h1 id="auth-title">
                    Welcome back
                </h1>

                <p id="auth-description">
                    Log in to continue to MinePeak Market.
                </p>

            </div>


            <!-- FORM -->

            <form id="auth-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="btn primary"
                    id="auth-button"
                >
                    Login
                </button>


                <p id="auth-message"></p>

            </form>

        </div>

    </div>

</section>

</main>


<!-- =================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* =================================
       SUPABASE CONFIG
    ================================= */

    const SUPABASE_URL =
        "https://uxxcmrewhohvhetfjlle.supabase.co/rest/v1/";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_44ZK_yp2muDR6QqpErQKJg_etMtYTUW";


    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =================================
       ELEMENTS
    ================================= */

    const form =
        document.getElementById("auth-form");

    const button =
        document.getElementById("auth-button");

    const message =
        document.getElementById("auth-message");

    const loginTab =
        document.getElementById("login-tab");

    const signupTab =
        document.getElementById("signup-tab");

    const title =
        document.getElementById("auth-title");

    const description =
        document.getElementById("auth-description");

    const indicator =
        document.getElementById("tab-indicator");

    const copy =
        document.getElementById("auth-copy");


    let signupMode = false;


    /* =================================
       CHANGE AUTH MODE
    ================================= */

    function switchMode(isSignup) {

        if (signupMode === isSignup) {
            return;
        }

        signupMode = isSignup;


        /* ---------------------------------
           Start exit animation
        --------------------------------- */

        const direction =
            isSignup ? "slide-left" : "slide-right";

        copy.classList.add(direction);
        form.classList.add(direction);


        /* ---------------------------------
           Move blue indicator
        --------------------------------- */

        if (isSignup) {

            indicator.classList.add("signup");

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

        } else {

            indicator.classList.remove("signup");

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

        }


        /* ---------------------------------
           Change content after animation
        --------------------------------- */

        setTimeout(function () {

            if (signupMode) {

                title.textContent =
                    "Create your account";

                description.textContent =
                    "Join MinePeak Market and start trading.";

                button.textContent =
                    "Create Account";

            } else {

                title.textContent =
                    "Welcome back";

                description.textContent =
                    "Log in to continue to MinePeak Market.";

                button.textContent =
                    "Login";

            }


            message.textContent = "";


            /* ---------------------------------
               Enter animation
            --------------------------------- */

            copy.classList.remove(direction);
            form.classList.remove(direction);

            const enterDirection =
                isSignup
                    ? "slide-right"
                    : "slide-left";

            copy.classList.add(enterDirection);
            form.classList.add(enterDirection);


            requestAnimationFrame(function () {

                requestAnimationFrame(function () {

                    copy.classList.remove(enterDirection);
                    form.classList.remove(enterDirection);

                });

            });

        }, 250);

    }


    /* =================================
       TAB EVENTS
    ================================= */

    loginTab.addEventListener(
        "click",
        function () {

            switchMode(false);

        }
    );


    signupTab.addEventListener(
        "click",
        function () {

            switchMode(true);

        }
    );


    /* =================================
       FORM SUBMISSION
    ================================= */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                message.textContent =
                    "Please enter your email and password.";

                return;
            }


            button.disabled = true;

            message.textContent =
                "Please wait...";


            /* =================================
               SIGN UP
            ================================= */

            if (signupMode) {

                const { error } =
                    await supabase.auth.signUp({

                        email: email,
                        password: password

                    });


                button.disabled = false;


                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }


                message.textContent =
                    "Account created! Check your email to verify your account.";

                return;
            }


            /* =================================
               LOGIN
            ================================= */

            const { error } =
                await supabase.auth.signInWithPassword({

                    email: email,
                    password: password

                });


            button.disabled = false;


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            message.textContent =
                "Login successful!";


            setTimeout(function () {

                window.location.href =
                    "index.html";

            }, 1000);

        }
    );

</script>

</body>
</html>
